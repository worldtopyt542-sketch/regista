name: Buffer - diagnosi

on:
  workflow_dispatch:

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python src/buffer.py PostType TikTokPostMetadataInput YoutubePrivacy VideoMetadataInput LimitReachedError InvalidInputError
