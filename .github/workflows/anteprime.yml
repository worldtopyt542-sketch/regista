name: Anteprime (video di un giro nella Release "anteprime")

# I video di un giro Facts finiscono in una Release pre-release "anteprime": da li' Claude li scarica e li
# allega nella chat del progetto (gli artefatti delle Actions non sono raggiungibili dalla sandbox cloud).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numero del giro (run id) di cui pubblicare i video"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: video
      - name: Carica nella Release "anteprime"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view anteprime >/dev/null 2>&1 || \
            gh release create anteprime --prerelease --title "Anteprime" --notes "Video di prova, non pubblicati. Si sovrascrivono."
          find video -name '*.mp4' -exec gh release upload anteprime --clobber {} +
