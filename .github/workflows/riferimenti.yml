name: Analizza Shorts di riferimento

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Link degli Shorts da prendere a modello (separati da spazio o virgola)"
        required: true

permissions:
  contents: read

jobs:
  analizza:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gemini guarda gli Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINK: ${{ inputs.link }}
        run: python src/riferimenti.py "$LINK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riferimenti
          path: riferimenti/
          if-no-files-found: ignore
