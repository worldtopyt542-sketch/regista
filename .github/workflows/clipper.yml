name: Autoclipper Planet Off Scale

on:
  # schedule:  spento il 27/11/2026: YouTube blocca i server di GitHub. Si riaccende con il runner sul PC di Fra
  #   o con YT_COOKIES (vedi COLLABORARE.md).
  #   - cron: "7 2 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Link del video lungo da clippare (facoltativo)"
        default: ""

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clippa:
    # YouTube blocca spesso i server di GitHub ("Sign in to confirm you're not a bot").
    # Variabile CLIPPER_RUNNER = self-hosted -> il giro gira sul PC di Fra (IP di casa, CPU piu' forte). Vedi COLLABORARE.md.
    runs-on: ${{ vars.CLIPPER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Stato del bot (ramo stato)
        run: .github/carica-stato.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa ffmpeg e font
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Installa librerie
        run: pip install -q -U -r requirements.txt
      - name: Cookie per YouTube (facoltativo)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: '[ -n "$YT_COOKIES" ] && printf "%s" "$YT_COOKIES" > cookies.txt || true'
      - name: Fa lavorare gli agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          URL: ${{ github.event.inputs.url }}
          PYTHONUNBUFFERED: "1"
        run: python src/clipper.py
      - name: Salva l'archivio e le clip pronte
        if: always()
        run: |
          rm -f cookies.txt
          .github/salva-stato.sh "Archivio clip $(date -u +%F-%H)" clipper.json pronte
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
