name: Autoclipper GTA 6

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore controlla Telegram e i canali
  workflow_dispatch:
    inputs:
      url:
        description: "Link del video lungo da clippare (facoltativo)"
        default: ""

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clippa:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa ffmpeg e font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Installa librerie
        run: pip install -q -U -r requirements.txt
      - name: Cookie per YouTube (facoltativo)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: '[ -n "$YT_COOKIES" ] && printf "%s" "$YT_COOKIES" > cookies.txt || true'
      - name: Fa lavorare gli agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL: ${{ github.event.inputs.url }}
          PYTHONUNBUFFERED: "1"
        run: python src/clipper.py
      - name: Salva l'archivio
        if: always()
        run: |
          rm -f cookies.txt
          git config user.name "regista-bot"
          git config user.email "regista-bot@users.noreply.github.com"
          git add clipper.json
          git diff --cached --quiet || git commit -m "Archivio clip $(date -u +%F-%H)"
          git pull --rebase -q || true
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
