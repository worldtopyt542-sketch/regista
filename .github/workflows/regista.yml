name: News GTA 6 (5 lingue)

on:
  schedule:
    - cron: "43 4 * * *"   # 05:43 in Italia: 2 news GTA 6 pronte per la mattina
  workflow_dispatch:         # pulsante "Run workflow" per avviarlo a mano
    inputs:
      quanti:
        description: "Quanti video creare"
        default: "3"

permissions:
  contents: write            # serve per salvare archivio.json

concurrency:
  group: regista
  cancel-in-progress: false

jobs:
  produci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa ffmpeg e font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Installa librerie Python
        run: pip install -q -r requirements.txt
      - name: Cookie per YouTube (facoltativo)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: '[ -n "$YT_COOKIES" ] && printf "%s" "$YT_COOKIES" > cookies.txt || true'
      - name: Fa lavorare gli agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUNBUFFERED: "1"
          QUANTI: ${{ github.event.inputs.quanti }}
        run: python src/regista.py
      - name: Salva l'archivio (anti-doppioni)
        if: always()
        run: |
          git config user.name "regista-bot"
          git config user.email "regista-bot@users.noreply.github.com"
          git add archivio.json
          git diff --cached --quiet || git commit -m "Archivio aggiornato $(date -u +%F)"
          rm -f cookies.txt
          git pull --rebase -q || true
          git push || true
      - name: Conserva i video anche su GitHub (7 giorni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
