name: Controlla i filmati della scaletta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scaletta.json]

permissions:
  contents: read

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cerca i filmati di ogni voce (NASA, Pexels)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python src/copertura.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copertura
          path: copertura/
          if-no-files-found: ignore
