name: Off Scale Facts (NASA + natura)

on:
  schedule:
    - cron: "37 4 * * *"   # 05:37 in Italia: arriva su Telegram insieme alle clip della notte
  workflow_dispatch:
    inputs:
      quanti:
        description: "Quanti video Facts creare"
        default: "1"

permissions:
  contents: write

concurrency:
  group: fatti
  cancel-in-progress: false

jobs:
  produci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Stato del bot (ramo stato)
        run: .github/carica-stato.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa ffmpeg e font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Installa librerie Python
        run: pip install -q -r requirements.txt
      - name: Fa lavorare gli agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUNBUFFERED: "1"
          QUANTI: ${{ github.event.inputs.quanti }}
        run: python src/fatti.py
      - name: Salva l'archivio (anti-doppioni) e i video pronti
        if: always()
        run: .github/salva-stato.sh "Archivio Facts $(date -u +%F)" archivio.json pronte
      - name: Conserva i video anche su GitHub (7 giorni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facts-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
