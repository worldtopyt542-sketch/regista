name: Pubblicatore (Telegram -> social)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stato del bot (ramo stato)
        run: .github/carica-stato.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/pubblica.py
      - if: always()
        run: .github/salva-stato.sh "Stato pubblicazioni" pubblica.json
