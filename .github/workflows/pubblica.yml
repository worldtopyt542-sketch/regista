name: Pubblicatore (Telegram -> social)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
        run: python src/pubblica.py
      - if: always()
        run: |
          git config user.name "regista-bot"
          git config user.email "regista-bot@users.noreply.github.com"
          git add pubblica.json
          git diff --cached --quiet || git commit -q -m "Stato pubblicazioni"
          git pull --rebase -q || true
          git push -q || true
